name: foryou-prod

# Self-hosted production stack (single-VM deploy). Swap postgres/redis for
# managed services by pointing DATABASE_URL/REDIS_URL at them and deleting
# those two services — nothing else changes. Media storage is Cloudflare R2
# (S3_ENDPOINT in .env), not self-hosted, so there's no minio service here
# unlike docker-compose.dev.yml.
#
# Single-origin deploy on a dedicated VPS/domain — `web` is the only public
# origin (bound to host 80/443 directly): it terminates TLS itself and
# reverse-proxies /api/v1 + /socket.io to `api` internally (docker/nginx/web.conf),
# so the browser never needs CORS. `certbot` issues/renews the cert into a
# volume `web` also mounts; scripts/init-letsencrypt.sh does the one-time
# bootstrap (run once, before the very first `up`, or `web` won't start —
# see that script's header comment for why). This assumes nothing else on
# the host already owns 80/443 — if it shares a VPS with other apps, this
# whole approach needs rethinking instead (ask before reusing it there).

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foryou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-foryou}
    volumes:
      - foryou_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foryou} -d ${POSTGRES_DB:-foryou}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - foryou_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: always
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Restricts nginx's built-in envsubst-on-templates step to only this
      # variable — by default it substitutes every $name in the template
      # matching any container env var, which would corrupt nginx's own
      # built-in variables (e.g. $host, $remote_addr) in docker/nginx/web.conf
      # if any of them ever collided with a real env var name.
      NGINX_ENVSUBST_FILTER: ^DOMAIN$$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Renews the cert every 12h (a no-op until it's within its renewal
  # window); does NOT issue the first cert — that chicken-and-egg bootstrap
  # is scripts/init-letsencrypt.sh, run once before `web` can start clean
  # (its 443 server block needs cert files that don't exist yet otherwise).
  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  foryou_pgdata:
  foryou_redisdata:
  certbot_conf:
  certbot_www:
