name: foryou-prod

# Self-hosted production stack (single-VM deploy). Swap postgres/redis for
# managed services by pointing DATABASE_URL/REDIS_URL at them and deleting
# those two services — nothing else changes. Media storage is Cloudflare R2
# (S3_ENDPOINT in .env), not self-hosted, so there's no minio service here
# unlike docker-compose.dev.yml.
#
# `web` and `api` are split across two public subdomains (foryou.citymarket.tech,
# api.foryou.citymarket.tech), fronted by the `nginx` service below — the only
# container bound to the VPS's public 80/443, terminating TLS via certs the
# `certbot` service issues/renews (bootstrap once with scripts/init-letsencrypt.sh).
# `web`/`api` publish no host ports at all; `nginx` reaches them over the
# internal Docker network by service name. The Nginx baked into the web image
# itself (docker/nginx/web.conf) only serves inside that one container.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foryou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-foryou}
    volumes:
      - foryou_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foryou} -d ${POSTGRES_DB:-foryou}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - foryou_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: always
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # TLS-terminating reverse proxy — the only service bound to the VPS's
  # public ports. Reloads itself every 6h (via `command:` below) to pick up
  # certs the `certbot` service renews, since nginx doesn't watch cert files
  # for changes on its own.
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/edge/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - web
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Renews certs every 12h (a no-op until they're within their renewal
  # window); does NOT issue the first cert — that chicken-and-egg bootstrap
  # is scripts/init-letsencrypt.sh, run once before `nginx` can start clean.
  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  foryou_pgdata:
  foryou_redisdata:
  certbot_conf:
  certbot_www:
