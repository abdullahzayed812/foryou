name: foryou-prod

# Self-hosted production stack (single-VM deploy). Swap postgres/redis for
# managed services by pointing DATABASE_URL/REDIS_URL at them and deleting
# those two services — nothing else changes. Media storage is Cloudflare R2
# (S3_ENDPOINT in .env), not self-hosted, so there's no minio service here
# unlike docker-compose.dev.yml.
#
# `web` and `api` are split across two public subdomains (foryou.citymarket.tech,
# api.foryou.citymarket.tech), but this VPS is shared with other apps under
# citymarket.tech that already have their own Nginx gateway (project
# "citymarket", container citymarket-nginx-1) permanently bound to the VPS's
# public 80/443 — a second Nginx here would just conflict on those ports. So
# `web`/`api` publish no host ports at all; instead they join that other
# project's Docker network (`citymarket_citymarket`, external: true below) so
# its gateway can reverse-proxy to them by container name, the same way it
# already does for its own admin/vendor/delivery dashboards. See
# /opt/citymarket/nginx/nginx.ssl.conf on the VPS for the two server blocks
# (foryou.citymarket.tech, api.foryou.citymarket.tech) that make this work,
# and DEPLOYMENT.md there for how its certificate (shared, --expand'd to
# cover these two extra names) is issued/renewed. The Nginx baked into our
# own web image (docker/nginx/web.conf) only serves inside that one container.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foryou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-foryou}
    volumes:
      - foryou_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foryou} -d ${POSTGRES_DB:-foryou}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - foryou_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    networks:
      default: {}
      citymarket_citymarket:
        aliases: [foryou-api]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    restart: always
    networks:
      default: {}
      citymarket_citymarket:
        aliases: [foryou-web]
    depends_on:
      - api
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  foryou_pgdata:
  foryou_redisdata:

networks:
  default: {}
  # The other project's ("citymarket") Docker Compose network — its Nginx
  # gateway lives there and needs to reach `web`/`api` by name. Must already
  # exist (created automatically whenever /opt/citymarket's own compose
  # stack is up); this project only joins it, never creates/owns it.
  citymarket_citymarket:
    external: true
