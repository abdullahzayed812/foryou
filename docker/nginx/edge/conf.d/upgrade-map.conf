# Without this, hardcoding `Connection "upgrade"` on the api domain's
# Socket.IO proxy would break plain (non-websocket) HTTP requests, which
# need `Connection: close` instead. Must live at the http{} level (this
# whole conf.d/ is included there by the base nginx:alpine image), not
# inside a server{} block.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
