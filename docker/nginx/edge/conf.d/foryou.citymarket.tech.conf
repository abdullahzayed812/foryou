# Edge Nginx — runs as the `nginx` container in docker-compose.prod.yml, the
# only thing bound to the VPS's public 80/443. Terminates TLS and reverse-
# proxies to the `web` container over the internal Docker network (no host
# port needed on `web` itself). Certs come from the `certbot` container
# sharing the certbot_conf volume — see scripts/init-letsencrypt.sh for the
# one-time bootstrap that issues them.

server {
  listen 80;
  server_name foryou.citymarket.tech;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name foryou.citymarket.tech;

  ssl_certificate /etc/letsencrypt/live/foryou.citymarket.tech/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/foryou.citymarket.tech/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;

  location / {
    proxy_pass http://web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
