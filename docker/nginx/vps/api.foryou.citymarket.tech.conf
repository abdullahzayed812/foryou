# Host-level Nginx (VPS) — see README.md in this directory. Reverse-proxies
# the public API domain to the `api` container, which docker-compose.prod.yml
# binds to 127.0.0.1 only. Includes the websocket upgrade headers Socket.IO
# needs (connection-upgrade-map.conf must be installed in /etc/nginx/conf.d/
# first). Run `certbot --nginx` after this is enabled to add the 443 server
# block + HTTP->HTTPS redirect.

server {
  listen 80;
  listen [::]:80;
  server_name api.foryou.citymarket.tech;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
