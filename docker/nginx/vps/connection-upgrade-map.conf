# Copy to /etc/nginx/conf.d/ — must live in the http{} block (conf.d is
# included there by Debian/Ubuntu's default nginx.conf), not inside a
# server{} block. Without this, hardcoding `Connection "upgrade"` on the
# api subdomain's Socket.IO proxy would break plain (non-websocket) HTTP
# requests, which need `Connection: close` instead.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
