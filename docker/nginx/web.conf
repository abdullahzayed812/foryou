# Served by the apps/web image itself — just the built SPA. The API lives on
# its own subdomain (api.foryou.citymarket.tech), reverse-proxied straight to
# the api container by the host-level Nginx (docker/nginx/vps/), so this
# container never proxies to `api` itself; VITE_API_URL points the browser
# there directly and CORS (apps/api's `allowedOrigins`) covers the rest.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Hashed filenames (Vite's default) can be cached forever; index.html must
  # never be, or clients keep loading a stale build after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
