# Served by the apps/web image itself — the single public origin for the
# whole app. Terminates TLS, serves the built SPA, and reverse-proxies
# /api/v1 + /socket.io + /healthz to the api service, so the browser only
# ever talks to one hostname (no CORS needed). `${DOMAIN}` is substituted at
# container *start* (not build time) by the base nginx:alpine image's
# built-in envsubst-on-templates mechanism, from the `DOMAIN` env var in
# .env — see docker-compose.prod.yml. Certs come from the certbot service
# sharing the certbot_conf/certbot_www volumes; scripts/init-letsencrypt.sh
# does the one-time bootstrap (a throwaway dummy cert so this container can
# even start before a real one exists, then swaps it for the real one).

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Plain-HTTP liveness probe for this container's own HEALTHCHECK — deliberately
  # not proxied to the api and not redirected to https, so it can't be broken by
  # either of those (e.g. the redirect below would fail TLS validation for
  # "localhost", the Host header wget sends from inside the container).
  location = /nginx-health {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Frame-Options           "SAMEORIGIN" always;
  add_header X-Content-Type-Options    "nosniff" always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  location /api/v1/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://api:4000/healthz;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
  }

  # Hashed filenames (Vite's default) can be cached forever; index.html must
  # never be, or clients keep loading a stale build after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
