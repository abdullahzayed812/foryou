name: foryou-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foryou
      POSTGRES_PASSWORD: foryou
      POSTGRES_DB: foryou_dev
    ports:
      # Host 5434 (not 5432) — this machine already runs another Postgres on
      # 5432. Only the host-side port differs; containers on foryou_net still
      # reach this at postgres:5432.
      - "5434:5432"
    volumes:
      - foryou_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foryou -d foryou_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host 6380 (not 6379) — another Redis container already holds 6379.
      - "6380:6379"
    volumes:
      - foryou_redisdata_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible local stand-in for Cloudflare R2 (architecture doc §01/§12).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foryou-dev
      MINIO_ROOT_PASSWORD: foryou-dev-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - foryou_media_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 foryou-dev foryou-dev-secret &&
      mc mb -p local/foryou-media &&
      mc anonymous set public local/foryou-media &&
      exit 0
      "

  # Catches every outbound email in dev instead of hitting a real SMTP
  # provider — inbox at http://localhost:8025 (architecture doc §01 Nodemailer).
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  foryou_pgdata_dev:
  foryou_redisdata_dev:
  foryou_media_dev:
